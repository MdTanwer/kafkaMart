quarkus.application.name=notification-service
quarkus.http.port=8084
quarkus.http.host=0.0.0.0
quarkus.shutdown.timeout=30S

# %dev / %prod talk to compose. %test omits brokers so Kafka Dev Services injects them.
%dev.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
quarkus.kafka.health.enabled=true
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${kafka.bootstrap.servers}
mp.messaging.connector.smallrye-kafka.health-enabled=true
mp.messaging.connector.smallrye-kafka.health-readiness-enabled=true
mp.messaging.connector.smallrye-kafka.health-readiness-timeout=5000
mp.messaging.connector.smallrye-kafka.acks=all
mp.messaging.connector.smallrye-kafka.enable.idempotence=true

# ---------------------------------------------------------------------------
# Fan-out: TWO consumer groups on the same topic `payments`.
# Each group gets a copy of every PaymentCompleted (email AND sms).
# payments is produced inside a Kafka TX — isolation.level=read_committed is required.
# ---------------------------------------------------------------------------

# payments-email — group notification-email, CooperativeStickyAssignor (incremental rebalance)
mp.messaging.incoming.payments-email.connector=smallrye-kafka
mp.messaging.incoming.payments-email.topic=${KAFKA_TOPIC_PAYMENTS:payments}
mp.messaging.incoming.payments-email.group.id=notification-email
mp.messaging.incoming.payments-email.cloud-events=false
mp.messaging.incoming.payments-email.enable.auto.commit=false
mp.messaging.incoming.payments-email.commit-strategy=throttled
mp.messaging.incoming.payments-email.auto.offset.reset=earliest
mp.messaging.incoming.payments-email.isolation.level=read_committed
mp.messaging.incoming.payments-email.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
mp.messaging.incoming.payments-email.consumer-rebalance-listener.name=payments-email
mp.messaging.incoming.payments-email.interceptor.classes=com.kafkamart.common.trace.TraceIdConsumerInterceptor
mp.messaging.incoming.payments-email.fail-on-deserialization-failure=false

# payments-sms — group notification-sms, eager RangeAssignor (classic stop-the-world rebalance)
# RangeAssignor is the Kafka 3.x default first strategy; set explicitly so the eager vs
# cooperative demo does not depend on client default order (Kafka 4 prefers cooperative).
mp.messaging.incoming.payments-sms.connector=smallrye-kafka
mp.messaging.incoming.payments-sms.topic=${KAFKA_TOPIC_PAYMENTS:payments}
mp.messaging.incoming.payments-sms.group.id=notification-sms
mp.messaging.incoming.payments-sms.cloud-events=false
mp.messaging.incoming.payments-sms.enable.auto.commit=false
mp.messaging.incoming.payments-sms.commit-strategy=throttled
mp.messaging.incoming.payments-sms.auto.offset.reset=earliest
mp.messaging.incoming.payments-sms.isolation.level=read_committed
mp.messaging.incoming.payments-sms.partition.assignment.strategy=org.apache.kafka.clients.consumer.RangeAssignor
mp.messaging.incoming.payments-sms.consumer-rebalance-listener.name=payments-sms
mp.messaging.incoming.payments-sms.interceptor.classes=com.kafkamart.common.trace.TraceIdConsumerInterceptor
mp.messaging.incoming.payments-sms.fail-on-deserialization-failure=false
mp.messaging.incoming.payments-sms.max.poll.interval.ms=10000
mp.messaging.incoming.payments-sms.max.poll.records=1

# shipments — same group.id as email (second topic in notification-email). Same cooperative assignor.
mp.messaging.incoming.shipments-in.connector=smallrye-kafka
mp.messaging.incoming.shipments-in.topic=${KAFKA_TOPIC_SHIPMENTS:shipments}
mp.messaging.incoming.shipments-in.group.id=notification-email
mp.messaging.incoming.shipments-in.cloud-events=false
mp.messaging.incoming.shipments-in.enable.auto.commit=false
mp.messaging.incoming.shipments-in.commit-strategy=throttled
mp.messaging.incoming.shipments-in.auto.offset.reset=earliest
mp.messaging.incoming.shipments-in.isolation.level=read_committed
mp.messaging.incoming.shipments-in.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
mp.messaging.incoming.shipments-in.interceptor.classes=com.kafkamart.common.trace.TraceIdConsumerInterceptor
mp.messaging.incoming.shipments-in.fail-on-deserialization-failure=false

quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-openapi.path=/q/openapi
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.http.non-application-root-path=/q

%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.console.json.pretty=false
%dev.quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.pretty=true
%dev.quarkus.log.category."com.kafkamart.notification".level=INFO
%test.quarkus.log.console.json.enabled=false
%test.quarkus.log.category."com.kafkamart.notification".level=INFO

quarkus.kafka.devservices.enabled=true
quarkus.kafka.devservices.topic-partitions.payments=6
quarkus.kafka.devservices.topic-partitions.shipments=6
%test.quarkus.kafka.devservices.enabled=true
%test.quarkus.kafka.devservices.provider=redpanda
%test.quarkus.kafka.devservices.topic-partitions-timeout=30S
%dev.quarkus.kafka.devservices.enabled=false
%prod.quarkus.kafka.devservices.enabled=false

%test.mp.messaging.outgoing.payments-seed.connector=smallrye-kafka
%test.mp.messaging.outgoing.payments-seed.topic=${KAFKA_TOPIC_PAYMENTS:payments}
%test.mp.messaging.outgoing.payments-seed.cloud-events=false
%test.mp.messaging.outgoing.payments-seed.acks=all
%test.mp.messaging.outgoing.payments-seed.enable.idempotence=false
%test.mp.messaging.outgoing.payments-seed.key.serializer=org.apache.kafka.common.serialization.StringSerializer
%test.mp.messaging.outgoing.payments-seed.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

%test.mp.messaging.outgoing.shipments-seed.connector=smallrye-kafka
%test.mp.messaging.outgoing.shipments-seed.topic=${KAFKA_TOPIC_SHIPMENTS:shipments}
%test.mp.messaging.outgoing.shipments-seed.cloud-events=false
%test.mp.messaging.outgoing.shipments-seed.acks=all
%test.mp.messaging.outgoing.shipments-seed.enable.idempotence=false
%test.mp.messaging.outgoing.shipments-seed.key.serializer=org.apache.kafka.common.serialization.StringSerializer
%test.mp.messaging.outgoing.shipments-seed.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
