quarkus.application.name=inventory-service
quarkus.http.port=8081
quarkus.http.host=0.0.0.0
quarkus.shutdown.timeout=30S

# %dev / %prod talk to compose. %test omits brokers/jdbc so Kafka + Postgres Dev Services inject them.
%dev.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
quarkus.kafka.health.enabled=true
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${kafka.bootstrap.servers}
mp.messaging.connector.smallrye-kafka.health-enabled=true
mp.messaging.connector.smallrye-kafka.health-readiness-enabled=true
mp.messaging.connector.smallrye-kafka.health-readiness-timeout=5000
mp.messaging.connector.smallrye-kafka.acks=all
mp.messaging.connector.smallrye-kafka.enable.idempotence=true

%dev.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.db-kind=postgresql
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=${POSTGRES_USER:kafkamart}
%prod.quarkus.datasource.username=${POSTGRES_USER:kafkamart}
%dev.quarkus.datasource.password=${POSTGRES_PASSWORD:kafkamart}
%prod.quarkus.datasource.password=${POSTGRES_PASSWORD:kafkamart}
%dev.quarkus.datasource.jdbc.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/kafkamart}
%prod.quarkus.datasource.jdbc.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/kafkamart}
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.database.generation=update
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.datasource.health.enabled=true

# orders-in — consumer internals (manual ack, no auto-commit, rebalance listener)
mp.messaging.incoming.orders-in.connector=smallrye-kafka
mp.messaging.incoming.orders-in.topic=${KAFKA_TOPIC_ORDERS:orders}
mp.messaging.incoming.orders-in.group.id=inventory-service
mp.messaging.incoming.orders-in.cloud-events=false
mp.messaging.incoming.orders-in.enable.auto.commit=false
mp.messaging.incoming.orders-in.commit-strategy=throttled
mp.messaging.incoming.orders-in.auto.offset.reset=earliest
mp.messaging.incoming.orders-in.fetch.min.bytes=1024
mp.messaging.incoming.orders-in.fetch.max.wait.ms=500
mp.messaging.incoming.orders-in.max.partition.fetch.bytes=1048576
mp.messaging.incoming.orders-in.max.poll.records=500
mp.messaging.incoming.orders-in.max.poll.interval.ms=300000
mp.messaging.incoming.orders-in.consumer-rebalance-listener.name=orders-in
mp.messaging.incoming.orders-in.interceptor.classes=com.kafkamart.common.trace.TraceIdConsumerInterceptor
mp.messaging.incoming.orders-in.fail-on-deserialization-failure=false
mp.messaging.incoming.orders-in.failure-strategy=ignore

# inventory-out — idempotent producer of reservation results
mp.messaging.outgoing.inventory-out.connector=smallrye-kafka
mp.messaging.outgoing.inventory-out.topic=${KAFKA_TOPIC_INVENTORY_EVENTS:inventory-events}
mp.messaging.outgoing.inventory-out.cloud-events=false
mp.messaging.outgoing.inventory-out.acks=all
mp.messaging.outgoing.inventory-out.enable.idempotence=true
mp.messaging.outgoing.inventory-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.inventory-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.inventory-out.interceptor.classes=com.kafkamart.common.trace.TraceIdProducerInterceptor

%test.mp.messaging.outgoing.orders-seed.connector=smallrye-kafka
%test.mp.messaging.outgoing.orders-seed.topic=${KAFKA_TOPIC_ORDERS:orders}
%test.mp.messaging.outgoing.orders-seed.cloud-events=false
%test.mp.messaging.outgoing.orders-seed.key.serializer=org.apache.kafka.common.serialization.StringSerializer
%test.mp.messaging.outgoing.orders-seed.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
%test.mp.messaging.incoming.inventory-verify.connector=smallrye-kafka
%test.mp.messaging.incoming.inventory-verify.topic=${KAFKA_TOPIC_INVENTORY_EVENTS:inventory-events}
%test.mp.messaging.incoming.inventory-verify.cloud-events=false
%test.mp.messaging.incoming.inventory-verify.auto.offset.reset=earliest
%test.mp.messaging.incoming.inventory-verify.enable.auto.commit=true
%test.mp.messaging.incoming.inventory-verify.group.id=inventory-verify
%test.mp.messaging.incoming.inventory-verify.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
%test.mp.messaging.incoming.inventory-verify.fail-on-deserialization-failure=false

quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-openapi.path=/q/openapi
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.http.non-application-root-path=/q

%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.console.json.pretty=false
%dev.quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.pretty=true
%dev.quarkus.log.category."com.kafkamart.inventory".level=INFO
%test.quarkus.log.console.json.enabled=false
%test.quarkus.log.category."com.kafkamart.inventory".level=INFO
%test.quarkus.scheduler.enabled=false

quarkus.kafka.devservices.enabled=true
quarkus.kafka.devservices.topic-partitions.orders=6
quarkus.kafka.devservices.topic-partitions.inventory-events=6
%test.quarkus.kafka.devservices.enabled=true
%dev.quarkus.kafka.devservices.enabled=false
%prod.quarkus.kafka.devservices.enabled=false
%dev.quarkus.datasource.devservices.enabled=false
%prod.quarkus.datasource.devservices.enabled=false
