quarkus.application.name=order-api-service
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.shutdown.timeout=30S

%dev.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
%test.quarkus.kafka.devservices.enabled=true
%test.quarkus.kafka.devservices.provider=redpanda
%test.quarkus.kafka.devservices.topic-partitions.orders=6
quarkus.kafka.health.enabled=true
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${kafka.bootstrap.servers}
mp.messaging.connector.smallrye-kafka.health-enabled=true
mp.messaging.connector.smallrye-kafka.health-readiness-enabled=true
mp.messaging.connector.smallrye-kafka.health-readiness-timeout=5000
mp.messaging.connector.smallrye-kafka.acks=all
mp.messaging.connector.smallrye-kafka.enable.idempotence=true

# orders-out — producer internals (acks=all, idempotent, batched, VIP partitioner)
mp.messaging.outgoing.orders-out.connector=smallrye-kafka
mp.messaging.outgoing.orders-out.topic=${KAFKA_TOPIC_ORDERS:orders}
mp.messaging.outgoing.orders-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.orders-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.orders-out.cloud-events=false
mp.messaging.outgoing.orders-out.acks=all
mp.messaging.outgoing.orders-out.enable.idempotence=true
mp.messaging.outgoing.orders-out.retries=2147483647
mp.messaging.outgoing.orders-out.max.in.flight.requests.per.connection=5
mp.messaging.outgoing.orders-out.linger.ms=20
mp.messaging.outgoing.orders-out.batch.size=65536
mp.messaging.outgoing.orders-out.compression.type=lz4
mp.messaging.outgoing.orders-out.delivery.timeout.ms=120000
mp.messaging.outgoing.orders-out.partitioner=com.kafkamart.orderapi.VipPartitioner
mp.messaging.outgoing.orders-out.partitioner.class=com.kafkamart.orderapi.VipPartitioner
mp.messaging.outgoing.orders-out.interceptor.classes=com.kafkamart.common.trace.TraceIdProducerInterceptor

quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-openapi.path=/q/openapi
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.http.non-application-root-path=/q

%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.console.json.pretty=false
%dev.quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.pretty=true
%dev.quarkus.log.category."com.kafkamart.orderapi.VipPartitioner".level=DEBUG
%test.quarkus.log.console.json.enabled=false
%test.quarkus.log.category."com.kafkamart.orderapi.VipPartitioner".level=DEBUG

quarkus.kafka.devservices.enabled=true
quarkus.kafka.devservices.topic-partitions.orders=6
%dev.quarkus.kafka.devservices.enabled=false
%prod.quarkus.kafka.devservices.enabled=false

%test.mp.messaging.incoming.orders-verify.connector=smallrye-kafka
%test.mp.messaging.incoming.orders-verify.topic=${KAFKA_TOPIC_ORDERS:orders}
%test.mp.messaging.incoming.orders-verify.cloud-events=false
%test.mp.messaging.incoming.orders-verify.auto.offset.reset=earliest
%test.mp.messaging.incoming.orders-verify.enable.auto.commit=true
%test.mp.messaging.incoming.orders-verify.group.id=order-api-verify
%test.mp.messaging.incoming.orders-verify.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
%test.mp.messaging.incoming.orders-verify.fail-on-deserialization-failure=false
