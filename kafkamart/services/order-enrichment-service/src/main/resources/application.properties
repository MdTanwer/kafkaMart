quarkus.application.name=order-enrichment-service
quarkus.http.port=8087
quarkus.http.host=0.0.0.0
quarkus.shutdown.timeout=30S

# %dev / %prod talk to compose. %test omits brokers + schema.registry.url so
# Kafka + Apicurio Dev Services inject them.
%dev.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
quarkus.kafka.health.enabled=true
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${kafka.bootstrap.servers}
mp.messaging.connector.smallrye-kafka.health-enabled=true
mp.messaging.connector.smallrye-kafka.health-readiness-enabled=true
mp.messaging.connector.smallrye-kafka.health-readiness-timeout=5000
mp.messaging.connector.smallrye-kafka.acks=all
mp.messaging.connector.smallrye-kafka.enable.idempotence=true

%dev.mp.messaging.connector.smallrye-kafka.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8181}
%prod.mp.messaging.connector.smallrye-kafka.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8181}
mp.messaging.connector.smallrye-kafka.use.latest.version=true
%dev.mp.messaging.connector.smallrye-kafka.auto.register.schemas=true
%test.mp.messaging.connector.smallrye-kafka.auto.register.schemas=true
%prod.mp.messaging.connector.smallrye-kafka.auto.register.schemas=true

# ---------------------------------------------------------------------------
# Kafka Streams — topology in EnrichmentTopology (@Produces Topology)
# ---------------------------------------------------------------------------
%dev.quarkus.kafka-streams.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
%prod.quarkus.kafka-streams.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
quarkus.kafka-streams.application-id=order-enrichment-service
quarkus.kafka-streams.application-server=${ENRICHMENT_APPLICATION_SERVER:0.0.0.0:8087}
# Wait for source topics (create-topics.sh). orders-enriched is the sink; must exist too.
quarkus.kafka-streams.topics=${KAFKA_TOPIC_ORDERS:orders},${KAFKA_TOPIC_USERS:users},${KAFKA_TOPIC_ORDERS_ENRICHED:orders-enriched}

kafka-streams.replication.factor=3
kafka-streams.processing.guarantee=exactly_once_v2
kafka-streams.state.dir=${ENRICHMENT_STATE_DIR:/tmp/enrichment-state}
kafka-streams.commit.interval.ms=1000
kafka-streams.auto.offset.reset=earliest
kafka-streams.num.stream.threads=1
kafka-streams.consumer.isolation.level=read_committed
%dev.kafka-streams.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8181}
%prod.kafka-streams.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8181}
kafka-streams.specific.avro.reader=true
kafka-streams.auto.register.schemas=true

# users is created with 3 partitions; orders has 6. Join copartitions via repartition(3).
enrichment.users.partitions=${KAFKA_TOPIC_USERS_PARTITIONS:3}
# ktable (default) | global — see EnrichmentTopology.joinGlobalKTable
enrichment.join.mode=${ENRICHMENT_JOIN_MODE:ktable}

%test.kafka-streams.replication.factor=1
%test.kafka-streams.processing.guarantee=at_least_once
%test.kafka-streams.state.dir=target/enrichment-state-test
%test.kafka-streams.commit.interval.ms=100
# In-process mock registry (same JVM as Topology + users-seed). Avoids Apicurio in tests.
%test.kafka-streams.schema.registry.url=mock://enrichment-test
%test.mp.messaging.connector.smallrye-kafka.schema.registry.url=mock://enrichment-test
%test.mp.messaging.connector.smallrye-kafka.enable.idempotence=false

quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-openapi.path=/q/openapi
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.http.non-application-root-path=/q

%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.console.json.pretty=false
%dev.quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.pretty=true
%test.quarkus.log.console.json.enabled=false
quarkus.log.category."com.kafkamart.enrichment".level=INFO

quarkus.kafka.devservices.enabled=true
quarkus.kafka.devservices.topic-partitions.orders=6
quarkus.kafka.devservices.topic-partitions.users=3
quarkus.kafka.devservices.topic-partitions.orders-enriched=6
%test.quarkus.kafka.devservices.enabled=true
%test.quarkus.kafka.devservices.provider=redpanda
%test.quarkus.kafka.devservices.topic-partitions-timeout=30S
%dev.quarkus.kafka.devservices.enabled=false
%prod.quarkus.kafka.devservices.enabled=false
%dev.quarkus.apicurio-registry.devservices.enabled=false
%prod.quarkus.apicurio-registry.devservices.enabled=false
%test.quarkus.apicurio-registry.devservices.enabled=false

%test.mp.messaging.outgoing.orders-seed.connector=smallrye-kafka
%test.mp.messaging.outgoing.orders-seed.topic=${KAFKA_TOPIC_ORDERS:orders}
%test.mp.messaging.outgoing.orders-seed.cloud-events=false
%test.mp.messaging.outgoing.orders-seed.acks=all
%test.mp.messaging.outgoing.orders-seed.enable.idempotence=false
%test.mp.messaging.outgoing.orders-seed.key.serializer=org.apache.kafka.common.serialization.StringSerializer
%test.mp.messaging.outgoing.orders-seed.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

%test.mp.messaging.outgoing.users-seed.connector=smallrye-kafka
%test.mp.messaging.outgoing.users-seed.topic=${KAFKA_TOPIC_USERS:users}
%test.mp.messaging.outgoing.users-seed.cloud-events=false
%test.mp.messaging.outgoing.users-seed.acks=all
%test.mp.messaging.outgoing.users-seed.enable.idempotence=false
%test.mp.messaging.outgoing.users-seed.key.serializer=org.apache.kafka.common.serialization.StringSerializer
%test.mp.messaging.outgoing.users-seed.value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
%test.mp.messaging.outgoing.users-seed.schema.registry.url=mock://enrichment-test
%test.mp.messaging.outgoing.users-seed.auto.register.schemas=true
%test.mp.messaging.outgoing.users-seed.specific.avro.reader=true
