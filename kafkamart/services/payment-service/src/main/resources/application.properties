quarkus.application.name=payment-service
quarkus.http.port=8082
quarkus.http.host=0.0.0.0
quarkus.shutdown.timeout=30S

# %dev / %prod talk to compose. %test omits brokers so Kafka Dev Services injects them.
%dev.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
quarkus.kafka.health.enabled=true
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${kafka.bootstrap.servers}
mp.messaging.connector.smallrye-kafka.health-enabled=true
mp.messaging.connector.smallrye-kafka.health-readiness-enabled=true
mp.messaging.connector.smallrye-kafka.health-readiness-timeout=5000
mp.messaging.connector.smallrye-kafka.acks=all
mp.messaging.connector.smallrye-kafka.enable.idempotence=true

# ---------------------------------------------------------------------------
# Exactly-once (EOS) — SmallRye 4.33.0 / Quarkus 3.33
#
# Verified against KafkaConnectorIncomingConfiguration and
# KafkaConnectorOutgoingConfiguration in smallrye-reactive-messaging-kafka
# 4.33.0: there is NO incoming `exactly-once` attribute and NO outgoing
# `transactional` attribute. Setting those names would be ignored (or
# warned as unknown Kafka client keys) and would silently degrade to
# at-least-once if we used a plain @Incoming/@Outgoing processor.
#
# Documented equivalent (https://smallrye.io/smallrye-reactive-messaging/4.33.0/kafka/transactions/):
#   1. outgoing transactional.id  → KafkaProducer.initTransactions()
#   2. incoming commit-strategy=ignore → offsets committed inside the TX
#   3. KafkaTransactions.withTransactionAndAck(incoming, emitter -> ...)
#      consume-transform-produce: PaymentCompleted + consumer offset in ONE TX
# ---------------------------------------------------------------------------
mp.messaging.incoming.orders-in.connector=smallrye-kafka
mp.messaging.incoming.orders-in.topic=${KAFKA_TOPIC_ORDERS:orders}
mp.messaging.incoming.orders-in.group.id=payment-service
mp.messaging.incoming.orders-in.cloud-events=false
mp.messaging.incoming.orders-in.enable.auto.commit=false
mp.messaging.incoming.orders-in.commit-strategy=ignore
mp.messaging.incoming.orders-in.failure-strategy=ignore
mp.messaging.incoming.orders-in.auto.offset.reset=earliest
mp.messaging.incoming.orders-in.interceptor.classes=com.kafkamart.common.trace.TraceIdConsumerInterceptor
mp.messaging.incoming.orders-in.fail-on-deserialization-failure=false
mp.messaging.incoming.orders-in.max.poll.records=16

mp.messaging.outgoing.payments-out.connector=smallrye-kafka
mp.messaging.outgoing.payments-out.topic=${KAFKA_TOPIC_PAYMENTS:payments}
mp.messaging.outgoing.payments-out.cloud-events=false
mp.messaging.outgoing.payments-out.acks=all
mp.messaging.outgoing.payments-out.enable.idempotence=true
mp.messaging.outgoing.payments-out.transactional.id=payment-tx-${INSTANCE_ID:local-1}
mp.messaging.outgoing.payments-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.payments-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.payments-out.interceptor.classes=com.kafkamart.common.trace.TraceIdProducerInterceptor

# Chaos crash is armed via POST /api/payments/chaos/crash (never in prod).
payment.chaos.enabled=false
%dev.payment.chaos.enabled=true
%test.payment.chaos.enabled=true

quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-openapi.path=/q/openapi
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.http.non-application-root-path=/q

%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.console.json.pretty=false
%dev.quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.pretty=true
%dev.quarkus.log.category."com.kafkamart.payment".level=INFO
%test.quarkus.log.console.json.enabled=false
%test.quarkus.log.category."com.kafkamart.payment".level=INFO

# Redpanda Dev Services does NOT support consume-transform-produce EOS (KIP-447).
# Quarkus 3.33.3 providers: redpanda | strimzi | kafka-native. Use Strimzi (Apache Kafka)
# so transactional.id + sendOffsetsToTransaction work.
quarkus.kafka.devservices.enabled=true
quarkus.kafka.devservices.topic-partitions.orders=6
quarkus.kafka.devservices.topic-partitions.payments=6
%test.quarkus.kafka.devservices.enabled=true
%test.quarkus.kafka.devservices.provider=strimzi
%test.quarkus.kafka.devservices.topic-partitions-timeout=30S
%dev.quarkus.kafka.devservices.enabled=false
%prod.quarkus.kafka.devservices.enabled=false

%test.mp.messaging.outgoing.orders-seed.connector=smallrye-kafka
%test.mp.messaging.outgoing.orders-seed.topic=${KAFKA_TOPIC_ORDERS:orders}
%test.mp.messaging.outgoing.orders-seed.cloud-events=false
%test.mp.messaging.outgoing.orders-seed.key.serializer=org.apache.kafka.common.serialization.StringSerializer
%test.mp.messaging.outgoing.orders-seed.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Downstream consumers of `payments` MUST use isolation.level=read_committed
# or they will see records from aborted transactions (duplicates / phantoms).
%test.mp.messaging.incoming.payments-verify.connector=smallrye-kafka
%test.mp.messaging.incoming.payments-verify.topic=${KAFKA_TOPIC_PAYMENTS:payments}
%test.mp.messaging.incoming.payments-verify.cloud-events=false
%test.mp.messaging.incoming.payments-verify.auto.offset.reset=earliest
%test.mp.messaging.incoming.payments-verify.enable.auto.commit=true
%test.mp.messaging.incoming.payments-verify.group.id=payments-verify
%test.mp.messaging.incoming.payments-verify.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
%test.mp.messaging.incoming.payments-verify.isolation.level=read_committed
%test.mp.messaging.incoming.payments-verify.fail-on-deserialization-failure=false
