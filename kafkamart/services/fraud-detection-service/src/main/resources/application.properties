quarkus.application.name=fraud-detection-service
quarkus.http.port=8086
quarkus.http.host=0.0.0.0
quarkus.shutdown.timeout=30S

# %dev / %prod talk to compose. %test omits brokers so Kafka Dev Services injects them.
%dev.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
quarkus.kafka.health.enabled=true
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${kafka.bootstrap.servers}
mp.messaging.connector.smallrye-kafka.health-enabled=true
mp.messaging.connector.smallrye-kafka.health-readiness-enabled=true
mp.messaging.connector.smallrye-kafka.health-readiness-timeout=5000
mp.messaging.connector.smallrye-kafka.acks=all
mp.messaging.connector.smallrye-kafka.enable.idempotence=true

# ---------------------------------------------------------------------------
# Kafka Streams — topology in FraudTopology (@Produces Topology)
# quarkus.kafka-streams.* = Quarkus; kafka-streams.* = Kafka Streams passthrough
# ---------------------------------------------------------------------------
%dev.quarkus.kafka-streams.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
%prod.quarkus.kafka-streams.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
quarkus.kafka-streams.application-id=fraud-detection-service
# Readiness waits until these exist (created by scripts/create-topics.sh, not auto.create).
quarkus.kafka-streams.topics=${KAFKA_TOPIC_ORDERS:orders},${KAFKA_TOPIC_FRAUD_ALERTS:fraud-alerts}

kafka-streams.replication.factor=3
kafka-streams.processing.guarantee=exactly_once_v2
kafka-streams.state.dir=${FRAUD_STATE_DIR:/tmp/fraud-state}
kafka-streams.commit.interval.ms=1000
kafka-streams.auto.offset.reset=earliest
kafka-streams.num.stream.threads=1
kafka-streams.consumer.isolation.level=read_committed

# Single-broker Dev Services cannot honor RF=3 or consume-transform-produce EOS.
%test.kafka-streams.replication.factor=1
%test.kafka-streams.processing.guarantee=at_least_once
%test.kafka-streams.state.dir=target/fraud-state-test
%test.kafka-streams.commit.interval.ms=100

# fraud-alerts-in — REST reader (group fraud-alerts-reader), last 100 in memory
mp.messaging.incoming.fraud-alerts-in.connector=smallrye-kafka
mp.messaging.incoming.fraud-alerts-in.topic=${KAFKA_TOPIC_FRAUD_ALERTS:fraud-alerts}
mp.messaging.incoming.fraud-alerts-in.group.id=fraud-alerts-reader
mp.messaging.incoming.fraud-alerts-in.cloud-events=false
mp.messaging.incoming.fraud-alerts-in.enable.auto.commit=false
mp.messaging.incoming.fraud-alerts-in.commit-strategy=throttled
mp.messaging.incoming.fraud-alerts-in.auto.offset.reset=earliest
mp.messaging.incoming.fraud-alerts-in.isolation.level=read_committed
mp.messaging.incoming.fraud-alerts-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.fraud-alerts-in.fail-on-deserialization-failure=false
mp.messaging.incoming.fraud-alerts-in.interceptor.classes=com.kafkamart.common.trace.TraceIdConsumerInterceptor

quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-openapi.path=/q/openapi
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.http.non-application-root-path=/q

%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.console.json.pretty=false
%dev.quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.pretty=true
%test.quarkus.log.console.json.enabled=false
quarkus.log.category."com.kafkamart.fraud".level=INFO
# Windowed aggregation logs "Skipping record for expired window" at DEBUG (late-event demo).
%dev.quarkus.log.category."org.apache.kafka.streams.kstream.internals".level=DEBUG
%prod.quarkus.log.category."org.apache.kafka.streams.kstream.internals".level=DEBUG
%test.quarkus.log.category."org.apache.kafka.streams.kstream.internals".level=INFO

quarkus.kafka.devservices.enabled=true
quarkus.kafka.devservices.topic-partitions.orders=6
quarkus.kafka.devservices.topic-partitions.fraud-alerts=3
%test.quarkus.kafka.devservices.enabled=true
%test.quarkus.kafka.devservices.topic-partitions-timeout=30S
%dev.quarkus.kafka.devservices.enabled=false
%prod.quarkus.kafka.devservices.enabled=false

%test.mp.messaging.outgoing.orders-seed.connector=smallrye-kafka
%test.mp.messaging.outgoing.orders-seed.topic=${KAFKA_TOPIC_ORDERS:orders}
%test.mp.messaging.outgoing.orders-seed.cloud-events=false
%test.mp.messaging.outgoing.orders-seed.acks=all
%test.mp.messaging.outgoing.orders-seed.enable.idempotence=true
%test.mp.messaging.outgoing.orders-seed.key.serializer=org.apache.kafka.common.serialization.StringSerializer
%test.mp.messaging.outgoing.orders-seed.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
