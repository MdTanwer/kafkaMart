quarkus.application.name=user-profile-service
quarkus.http.port=8085
quarkus.http.host=0.0.0.0
quarkus.shutdown.timeout=30S

# %dev / %prod talk to compose. %test omits brokers and schema.registry.url so
# Kafka + Apicurio Dev Services inject them (Apicurio exposes Confluent ccompat).
%dev.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
quarkus.kafka.health.enabled=true
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${kafka.bootstrap.servers}
mp.messaging.connector.smallrye-kafka.health-enabled=true
mp.messaging.connector.smallrye-kafka.health-readiness-enabled=true
mp.messaging.connector.smallrye-kafka.health-readiness-timeout=5000
mp.messaging.connector.smallrye-kafka.acks=all
mp.messaging.connector.smallrye-kafka.enable.idempotence=true

%dev.mp.messaging.connector.smallrye-kafka.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8181}
%prod.mp.messaging.connector.smallrye-kafka.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8181}
mp.messaging.connector.smallrye-kafka.use.latest.version=true
%dev.mp.messaging.connector.smallrye-kafka.auto.register.schemas=true
%test.mp.messaging.connector.smallrye-kafka.auto.register.schemas=true
%prod.mp.messaging.connector.smallrye-kafka.auto.register.schemas=true

# users-out — Avro UserProfile, Kafka key = user_id
mp.messaging.outgoing.users-out.connector=smallrye-kafka
mp.messaging.outgoing.users-out.topic=${KAFKA_TOPIC_USERS:users}
mp.messaging.outgoing.users-out.cloud-events=false
mp.messaging.outgoing.users-out.acks=all
mp.messaging.outgoing.users-out.enable.idempotence=true
mp.messaging.outgoing.users-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.users-out.value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
mp.messaging.outgoing.users-out.interceptor.classes=com.kafkamart.common.trace.TraceIdProducerInterceptor

# users-in — compacted topic as table (group user-profile-cache)
mp.messaging.incoming.users-in.connector=smallrye-kafka
mp.messaging.incoming.users-in.topic=${KAFKA_TOPIC_USERS:users}
mp.messaging.incoming.users-in.group.id=user-profile-cache
mp.messaging.incoming.users-in.cloud-events=false
mp.messaging.incoming.users-in.enable.auto.commit=false
mp.messaging.incoming.users-in.commit-strategy=throttled
mp.messaging.incoming.users-in.auto.offset.reset=earliest
mp.messaging.incoming.users-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.users-in.value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
mp.messaging.incoming.users-in.specific.avro.reader=true
mp.messaging.incoming.users-in.interceptor.classes=com.kafkamart.common.trace.TraceIdConsumerInterceptor

quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-openapi.path=/q/openapi
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.http.non-application-root-path=/q

%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.console.json.pretty=false
%dev.quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.pretty=true
%dev.quarkus.log.category."com.kafkamart.userprofile".level=INFO
%test.quarkus.log.console.json.enabled=false
%test.quarkus.log.category."com.kafkamart.userprofile".level=INFO

quarkus.kafka.devservices.enabled=true
quarkus.kafka.devservices.topic-partitions.users=3
%test.quarkus.kafka.devservices.enabled=true
%test.quarkus.kafka.devservices.provider=redpanda
%test.quarkus.kafka.devservices.topic-partitions-timeout=30S
%dev.quarkus.kafka.devservices.enabled=false
%prod.quarkus.kafka.devservices.enabled=false
%dev.quarkus.apicurio-registry.devservices.enabled=false
%prod.quarkus.apicurio-registry.devservices.enabled=false
%test.quarkus.apicurio-registry.devservices.enabled=true

%test.mp.messaging.incoming.users-wire.connector=smallrye-kafka
%test.mp.messaging.incoming.users-wire.topic=${KAFKA_TOPIC_USERS:users}
%test.mp.messaging.incoming.users-wire.cloud-events=false
%test.mp.messaging.incoming.users-wire.auto.offset.reset=earliest
%test.mp.messaging.incoming.users-wire.enable.auto.commit=true
%test.mp.messaging.incoming.users-wire.group.id=users-wire
%test.mp.messaging.incoming.users-wire.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
%test.mp.messaging.incoming.users-wire.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
