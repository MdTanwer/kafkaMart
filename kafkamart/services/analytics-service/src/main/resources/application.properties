quarkus.application.name=analytics-service
quarkus.http.port=8088
quarkus.http.host=0.0.0.0
quarkus.shutdown.timeout=30S

# %dev / %prod talk to compose. %test omits brokers/jdbc so Dev Services inject them.
%dev.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
quarkus.kafka.health.enabled=true
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${kafka.bootstrap.servers}
mp.messaging.connector.smallrye-kafka.health-enabled=true
mp.messaging.connector.smallrye-kafka.health-readiness-enabled=true
mp.messaging.connector.smallrye-kafka.health-readiness-timeout=5000
mp.messaging.connector.smallrye-kafka.acks=all
mp.messaging.connector.smallrye-kafka.enable.idempotence=true

quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=${POSTGRES_USER:kafkamart}
%prod.quarkus.datasource.username=${POSTGRES_USER:kafkamart}
%dev.quarkus.datasource.password=${POSTGRES_PASSWORD:kafkamart}
%prod.quarkus.datasource.password=${POSTGRES_PASSWORD:kafkamart}
%dev.quarkus.datasource.jdbc.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/kafkamart}
%prod.quarkus.datasource.jdbc.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/kafkamart}
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.database.generation=update
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.datasource.health.enabled=true
%dev.quarkus.datasource.devservices.enabled=false
%prod.quarkus.datasource.devservices.enabled=false

# users-cdc-in — Debezium flattened events (group analytics-cdc-reader)
mp.messaging.incoming.users-cdc-in.connector=smallrye-kafka
mp.messaging.incoming.users-cdc-in.topic=${KAFKA_TOPIC_USERS_CDC:users-cdc}
mp.messaging.incoming.users-cdc-in.group.id=analytics-cdc-reader
mp.messaging.incoming.users-cdc-in.cloud-events=false
mp.messaging.incoming.users-cdc-in.enable.auto.commit=false
mp.messaging.incoming.users-cdc-in.commit-strategy=throttled
mp.messaging.incoming.users-cdc-in.auto.offset.reset=earliest
mp.messaging.incoming.users-cdc-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.users-cdc-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.users-cdc-in.fail-on-deserialization-failure=false
mp.messaging.incoming.users-cdc-in.interceptor.classes=com.kafkamart.common.trace.TraceIdConsumerInterceptor

analytics.connect.url=${CONNECT_URL:http://localhost:8083}
analytics.elasticsearch.url=${ELASTICSEARCH_URL:http://localhost:9200}
analytics.connectors.dir=${KAFKAMART_CONNECTORS_DIR:../../infra/connectors}

quarkus.rest-client.connect.url=${analytics.connect.url}
quarkus.rest-client.connect.connect-timeout=3000
quarkus.rest-client.connect.read-timeout=8000
quarkus.rest-client.elasticsearch.url=${analytics.elasticsearch.url}
quarkus.rest-client.elasticsearch.connect-timeout=2000
quarkus.rest-client.elasticsearch.read-timeout=5000

quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-openapi.path=/q/openapi
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.http.non-application-root-path=/q

%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.console.json.pretty=false
%dev.quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.pretty=true
%test.quarkus.log.console.json.enabled=false
quarkus.log.category."com.kafkamart.analytics".level=INFO

quarkus.kafka.devservices.enabled=true
quarkus.kafka.devservices.topic-partitions.users-cdc=3
quarkus.kafka.devservices.topic-partitions.orders-enriched=6
%test.quarkus.kafka.devservices.enabled=true
%dev.quarkus.kafka.devservices.enabled=false
%prod.quarkus.kafka.devservices.enabled=false

%test.analytics.connect.url=http://127.0.0.1:9
%test.analytics.elasticsearch.url=http://127.0.0.1:9
%test.quarkus.rest-client.connect.url=http://127.0.0.1:9
%test.quarkus.rest-client.elasticsearch.url=http://127.0.0.1:9
%test.analytics.connectors.dir=../../infra/connectors
